name: CI

# Required status checks. Auto-merge (in autobuild.yml) only completes when
# these pass, so this workflow is the automated green-gate for the whole
# Developer-mode pipeline. Runs on every PR.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: mobile (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run ci   # typecheck && lint && test
      # Launch gate: the session screen — the surface that crashed builds
      # 50–53 at launch while CI stayed green — must actually mount, unmount,
      # and stay structurally dev-invariant (see mobile/src/__tests__/
      # launch-gate.test.tsx). It already runs inside `npm run ci`'s jest
      # pass; this named step keeps the gate explicit and un-losable if test
      # globs ever change.
      - name: launch gate (app mounts without throwing)
        run: npx jest src/__tests__/launch-gate.test.tsx

  server:
    name: server (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # Prompt size gate: system.battlebuddy.md is injected on every turn and
      # once ballooned 43 KB → 153 KB via the nightly design loop's unattended
      # appends (breaking voice at LiveKit's 64 KB dispatch cap). The gate
      # already runs inside `npm test`; this named step keeps it explicit and
      # un-losable if test globs ever change. Cap lives in server/promptGuard.js.
      - name: prompt size gate (system prompt under byte cap)
        run: node --test promptSize.test.js

  agent:
    name: agent (compile · import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: compile gate (all agent sources parse)
        run: python -m compileall -q .
      # Container-path gate. The Dockerfile flattens agent/ into /app, so
      # "agent.x" resolves to the agent.py MODULE at runtime, not a package —
      # while a repo-root checkout resolves it fine as a PEP 420 namespace
      # package. That asymmetry is why PR #101's `from agent.utils…` passed
      # every check and then crash-looped every voice job for ~18 hours.
      # Covers tests/ too: the pytest job also runs from agent/, so the flat
      # form is the only one that resolves anywhere we actually execute.
      - name: container-path gate (no repo-root-relative agent.* imports)
        run: |
          if grep -rnE '^[[:space:]]*(from|import)[[:space:]]+agent\.' --include='*.py' . ; then
            echo "::error::'agent.*' imports do not resolve in the container (the image is flat: /app/agent.py + /app/utils + /app/tools). Use 'from utils…' / 'from tools…'."
            exit 1
          fi
      # Import gate: executes agent.py's module-level code under the PINNED
      # livekit-agents version — the exact failure class that shipped in
      # PR #62 (@server.prewarm, no such attribute on AgentServer in 1.6.2)
      # and crash-looped bb-agent for two days while five green PRs "fixed"
      # other layers. Importing is safe: run_app is under __main__, so this
      # never starts a worker. Dummy env only — anything the module reads at
      # import time must tolerate placeholder values or this gate should fail.
      #
      # BLIND SPOT, know it: this executes module-level code ONLY. An import
      # inside a function or method body is never evaluated here. Keep local
      # imports (utils/, tools/) at module level or this gate cannot see them —
      # that is exactly how the missing agent/utils COPY shipped green.
      - name: import gate (module loads under pinned livekit-agents)
        env:
          LIVEKIT_URL: ws://localhost:7880
          LIVEKIT_API_KEY: ci-dummy
          LIVEKIT_API_SECRET: ci-dummy
          ANTHROPIC_API_KEY: ci-dummy
          DEEPGRAM_API_KEY: ci-dummy
          SERVER_URL: http://localhost:3333
          BB_CLIENT_TOKEN: ci-dummy
          APP_BASE: ${{ github.workspace }}
        run: python -c "import agent"

  # Promoted to a required context 2026-08-04: on its very first run this job
  # flagged the exact ModuleNotFoundError (agent.utils) that was crash-looping
  # every production voice session — it was non-blocking then, so the signal
  # was advisory. Green since PR #120. It blocks now.
  agent-tests:
    name: agent (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  # Report the aggregate check result back to the backend so the Dev tab can
  # flip the request to "Under development → checks passed/failed". Only fires
  # for pipeline branches (auto/dev-<id>); no-op otherwise. Mirrors the
  # required-context set exactly (mobile, server, agent, agent-tests).
  report:
    name: report status
    runs-on: ubuntu-latest
    needs: [mobile, server, agent, agent-tests]
    if: always() && startsWith(github.head_ref, 'auto/dev-')
    steps:
      - name: Extract request id
        id: rid
        run: echo "id=${GITHUB_HEAD_REF#auto/dev-}" >> "$GITHUB_OUTPUT"
      - name: Callback (passed)
        if: needs.mobile.result == 'success' && needs.server.result == 'success' && needs.agent.result == 'success' && needs.agent-tests.result == 'success'
        run: |
          curl -sf -X POST "${{ secrets.BB_SERVER_URL }}/dev/github/webhook" \
            -H "content-type: application/json" \
            -H "x-bb-status-token: ${{ secrets.BB_STATUS_WEBHOOK_TOKEN }}" \
            -d "{\"requestId\":\"${{ steps.rid.outputs.id }}\",\"event\":\"checks_passed\"}" || true
      - name: Callback (failed)
        if: needs.mobile.result != 'success' || needs.server.result != 'success' || needs.agent.result != 'success' || needs.agent-tests.result != 'success'
        run: |
          curl -sf -X POST "${{ secrets.BB_SERVER_URL }}/dev/github/webhook" \
            -H "content-type: application/json" \
            -H "x-bb-status-token: ${{ secrets.BB_STATUS_WEBHOOK_TOKEN }}" \
            -d "{\"requestId\":\"${{ steps.rid.outputs.id }}\",\"event\":\"checks_failed\",\"error\":\"CI failed\"}" || true
