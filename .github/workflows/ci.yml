name: CI

# Required status checks. Auto-merge (in autobuild.yml) only completes when
# these pass, so this workflow is the automated green-gate for the whole
# Developer-mode pipeline. Runs on every PR.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: mobile (typecheck · lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run ci   # typecheck && lint && test
      # Launch gate: the session screen — the surface that crashed builds
      # 50–53 at launch while CI stayed green — must actually mount, unmount,
      # and stay structurally dev-invariant (see mobile/src/__tests__/
      # launch-gate.test.tsx). It already runs inside `npm run ci`'s jest
      # pass; this named step keeps the gate explicit and un-losable if test
      # globs ever change.
      - name: launch gate (app mounts without throwing)
        run: npx jest src/__tests__/launch-gate.test.tsx

  server:
    name: server (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # Prompt size gate: system.battlebuddy.md is injected on every turn and
      # once ballooned 43 KB → 153 KB via the nightly design loop's unattended
      # appends (breaking voice at LiveKit's 64 KB dispatch cap). The gate
      # already runs inside `npm test`; this named step keeps it explicit and
      # un-losable if test globs ever change. Cap lives in server/promptGuard.js.
      - name: prompt size gate (system prompt under byte cap)
        run: node --test promptSize.test.js

  agent:
    name: agent (compile · import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: compile gate (all agent sources parse)
        run: python -m compileall -q .
      # Container-path gate. The Dockerfile flattens agent/ into /app, so
      # "agent.x" resolves to the agent.py MODULE at runtime, not a package —
      # while a repo-root checkout resolves it fine as a PEP 420 namespace
      # package. That asymmetry is why PR #101's `from agent.utils…` passed
      # every check and then crash-looped every voice job for ~18 hours.
      # Covers tests/ too: the pytest job also runs from agent/, so the flat
      # form is the only one that resolves anywhere we actually execute.
      - name: container-path gate (no repo-root-relative agent.* imports)
        run: |
          if grep -rnE '^[[:space:]]*(from|import)[[:space:]]+agent\.' --include='*.py' . ; then
            echo "::error::'agent.*' imports do not resolve in the container (the image is flat: /app/agent.py + /app/utils + /app/tools). Use 'from utils…' / 'from tools…'."
            exit 1
          fi
      # Import gate: executes agent.py's module-level code under the PINNED
      # livekit-agents version — the exact failure class that shipped in
      # PR #62 (@server.prewarm, no such attribute on AgentServer in 1.6.2)
      # and crash-looped bb-agent for two days while five green PRs "fixed"
      # other layers. Importing is safe: run_app is under __main__, so this
      # never starts a worker. Dummy env only — anything the module reads at
      # import time must tolerate placeholder values or this gate should fail.
      #
      # BLIND SPOT, know it: this executes module-level code ONLY. An import
      # inside a function or method body is never evaluated here. Keep local
      # imports (utils/, tools/) at module level or this gate cannot see them —
      # that is exactly how the missing agent/utils COPY shipped green.
      - name: import gate (module loads under pinned livekit-agents)
        env:
          LIVEKIT_URL: ws://localhost:7880
          LIVEKIT_API_KEY: ci-dummy
          LIVEKIT_API_SECRET: ci-dummy
          ANTHROPIC_API_KEY: ci-dummy
          DEEPGRAM_API_KEY: ci-dummy
          SERVER_URL: http://localhost:3333
          BB_CLIENT_TOKEN: ci-dummy
          APP_BASE: ${{ github.workspace }}
        run: python -c "import agent"

  # Promoted to a required context 2026-08-04: on its very first run this job
  # flagged the exact ModuleNotFoundError (agent.utils) that was crash-looping
  # every production voice session — it was non-blocking then, so the signal
  # was advisory. Green since PR #120. It blocks now.
  agent-tests:
    name: agent (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  # ─── Container boot fidelity gate ──────────────────────────────────────────
  # "CI green" must mean "the deployable container actually starts". Every job
  # above runs against a REPO-ROOT CHECKOUT with dev dependencies present —
  # which is not what Railway runs. Two production outages passed all of them
  # and still died on boot:
  #
  #   • bb-server — a module-scope `createClient()` threw during ESM evaluation
  #     on Node 20. index.js registers process.on('uncaughtException') on line
  #     1, but ESM evaluates every import BEFORE that line runs, so the throw
  #     was never caught: the process exited without reaching server.listen().
  #     `node --test` never imports the boot path, so `server (node --test)`
  #     stayed green through the whole outage.
  #
  #   • bb-agent — PR #62's `@server.prewarm` (no such attribute on
  #     AgentServer in the pinned livekit-agents), and later PR #101's
  #     `from agent.utils…` (#120). The image is FLAT (/app/agent.py +
  #     /app/utils + /app/tools), so `agent` is a MODULE in the container but
  #     resolves as a PEP 420 namespace PACKAGE in a repo-root checkout. The
  #     `agent (compile · import)` job runs in the checkout, so it sees the
  #     resolvable form. It also cannot see a COPY that the Dockerfile
  #     forgot — which is exactly how the missing `agent/utils` shipped green
  #     and crash-looped every voice job for ~18 hours.
  #
  # Source-tree checks are structurally blind to both classes. This job builds
  # the real production images and boots them.
  #
  # Keep this job free of anything that could make it lie: it asserts only two
  # things per service — the image builds, and the entrypoint gets past import
  # to the point of actually serving / running. Placeholder secrets, never
  # real ones; nothing here needs repo secrets, so it is safe on forks too.
  container-boot:
    name: container-boot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # ── bb-server: build the real production image ──────────────────────
      # Context is server/ — matches the Dockerfile (COPY package.json ./) and
      # the Railway service root. Retried: server deps pull onnxruntime-node,
      # whose postinstall downloads from api.nuget.org and has intermittently
      # ETIMEDOUT on GitHub runners. Network flake must not read as a boot
      # failure — three attempts, then fail honestly.
      - name: build bb-server image
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::bb-server image build (attempt $attempt)"
            if docker build -f server/Dockerfile -t bb-server:ci server; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "build attempt $attempt failed"; sleep 15
          done
          echo "::error::bb-server production image failed to build after 3 attempts."
          exit 1

      # Production-LIKE env: every variable the real service gets, with
      # placeholder values. The point is that the boot path RUNS — the
      # module-scope createClient() at index.js is behind a
      # `process.env.SUPABASE_URL ? …` ternary, so leaving Supabase unset
      # would skip the exact call that took production down. Supabase/LiveKit
      # point at the container's own loopback: syntactically valid URLs that
      # refuse instantly, so nothing hangs on DNS and no traffic leaves.
      # DEV_PIPELINE_ENABLED stays off — the dev worker must not dispatch.
      - name: boot bb-server (placeholder production env)
        run: |
          set -euo pipefail
          docker run -d --name bb-server-ci -p 3333:3333 \
            -e NODE_ENV=production \
            -e PORT=3333 \
            -e TZ=America/Chicago \
            -e ANTHROPIC_API_KEY=ci-placeholder-anthropic-key \
            -e SUPABASE_URL=http://127.0.0.1:54321 \
            -e SUPABASE_SERVICE_KEY=ci-placeholder-service-key \
            -e LIVEKIT_URL=ws://127.0.0.1:7880 \
            -e LIVEKIT_API_KEY=ci-placeholder \
            -e LIVEKIT_API_SECRET=ci-placeholder-livekit-secret-value \
            -e BB_ADMIN_SECRET=ci-placeholder \
            -e BB_CLIENT_TOKEN=ci-placeholder \
            -e BB_STATUS_WEBHOOK_TOKEN=ci-placeholder \
            -e BB_SERVER_URL=http://127.0.0.1:3333 \
            -e GITHUB_TOKEN=ci-placeholder \
            -e GITHUB_REPO=strangepair/BattleBuddy \
            -e RESEND_API_KEY=ci-placeholder \
            -e CONTEXT_STORE_DIR=/tmp/bb-ci-context \
            -e DEV_PIPELINE_ENABLED=false \
            bb-server:ci

      # The gate. A module-scope throw exits the process before server.listen()
      # ever runs, so "did it answer /health" is the honest question. Two ways
      # to fail: the container is gone (import-time crash — the promptPr.js
      # createClient()-on-Node-20 class), or it never became ready in time.
      - name: assert bb-server reaches listening / health-ready
        run: |
          set -uo pipefail
          ready=""
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' bb-server-ci 2>/dev/null)" != "true" ]; then
              code="$(docker inspect -f '{{.State.ExitCode}}' bb-server-ci 2>/dev/null || echo '?')"
              echo "----- bb-server logs -----"; docker logs bb-server-ci 2>&1 || true
              echo "::error::bb-server exited (code $code) before becoming health-ready. The deployable container does not boot — this is the import-time / module-scope crash class (a throw during ESM evaluation happens before index.js's uncaughtException handler is registered, so the process just dies)."
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:3333/health -o /tmp/bb-health.json 2>/dev/null; then
              ready="yes"; echo "health-ready after ${i}s: $(cat /tmp/bb-health.json)"; break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "----- bb-server logs -----"; docker logs bb-server-ci 2>&1 || true
            echo "::error::bb-server never answered GET /health within 90s. It is running but not serving — treat as a failed boot."
            exit 1
          fi
          # Still alive a beat later: catches a crash that lands just after
          # listen() (index.js swallows uncaughtException, so a dead-but-not-
          # exited server would otherwise slip through the poll above).
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' bb-server-ci)" != "true" ]; then
            echo "----- bb-server logs -----"; docker logs bb-server-ci 2>&1 || true
            echo "::error::bb-server became health-ready and then died. Not a stable boot."
            exit 1
          fi

      # Advisory only. With placeholder Supabase/LiveKit credentials, a
      # fire-and-forget background sweep CAN legitimately log [FATAL]
      # Unhandled rejection — failing on that would make this gate flaky and a
      # flaky gate gets disabled. The hard assertion above is the gate; this
      # just surfaces the log for whoever reads a failure.
      - name: bb-server boot log (advisory)
        if: always()
        run: docker logs bb-server-ci 2>&1 | tail -60 || true

      - name: tear down bb-server
        if: always()
        run: docker rm -f bb-server-ci >/dev/null 2>&1 || true

      # ── bb-agent: build the real production image ───────────────────────
      # Context is the repo ROOT — agent/Dockerfile COPYs agent/* and
      # server/prompts, so building from agent/ would not reproduce the image
      # Railway ships.
      - name: build bb-agent image
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::bb-agent image build (attempt $attempt)"
            if docker build -f agent/Dockerfile -t bb-agent:ci .; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "build attempt $attempt failed"; sleep 15
          done
          echo "::error::bb-agent production image failed to build after 3 attempts."
          exit 1

      # #120 in one step: the Dockerfile was missing `COPY agent/utils/`, and
      # nothing in a repo-root checkout can notice a COPY that isn't there.
      - name: assert bb-agent image layout (flat, complete)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh bb-agent:ci -c '
            set -e
            echo "----- /app -----"; ls -1 /app
            for p in /app/agent.py /app/server/voice-config.json; do
              [ -f "$p" ] || { echo "::error::missing file in image: $p"; exit 1; }
            done
            for d in /app/utils /app/tools /app/server/prompts; do
              [ -d "$d" ] || { echo "::error::missing directory in image: $d — a Dockerfile COPY is missing; the container will ModuleNotFoundError at import (this is PR #120)."; exit 1; }
            done
          '

      # The import gate, but against the REAL container layout. In here `agent`
      # is /app/agent.py (a module), not a namespace package, so a
      # `from agent.utils…` resolves in the checkout and fails here — the #120
      # asymmetry. Also executes agent.py's module-level code under the pinned
      # livekit-agents, which is the #62 (@server.prewarm) class. Safe: run_app
      # is under __main__, so importing never starts a worker.
      - name: bb-agent import gate (inside the real container)
        run: |
          set -euo pipefail
          docker run --rm \
            -e LIVEKIT_URL=ws://127.0.0.1:7880 \
            -e LIVEKIT_API_KEY=ci-placeholder \
            -e LIVEKIT_API_SECRET=ci-placeholder-livekit-secret-value \
            -e ANTHROPIC_API_KEY=ci-placeholder-anthropic-key \
            -e DEEPGRAM_API_KEY=ci-placeholder \
            -e SERVER_URL=http://127.0.0.1:3333 \
            -e BB_CLIENT_TOKEN=ci-placeholder \
            bb-agent:ci \
            python -c "import agent; import utils.deduplication; import tools.log_activity; print('bb-agent import OK')"

      # Beyond import: run the ACTUAL CMD the container ships with. It cannot
      # reach LiveKit here, so its exit status is not a verdict — we grep only
      # for import-RESOLUTION failures, which no amount of unreachable
      # infrastructure can produce. Deliberately narrow: a gate that fails on
      # connection errors would be flaky, and a flaky gate gets turned off.
      - name: bb-agent entrypoint smoke (real CMD)
        run: |
          set -uo pipefail
          docker run -d --name bb-agent-ci \
            -e LIVEKIT_URL=ws://127.0.0.1:7880 \
            -e LIVEKIT_API_KEY=ci-placeholder \
            -e LIVEKIT_API_SECRET=ci-placeholder-livekit-secret-value \
            -e ANTHROPIC_API_KEY=ci-placeholder-anthropic-key \
            -e DEEPGRAM_API_KEY=ci-placeholder \
            -e SERVER_URL=http://127.0.0.1:3333 \
            -e BB_CLIENT_TOKEN=ci-placeholder \
            bb-agent:ci
          sleep 30
          docker logs bb-agent-ci > /tmp/bb-agent.log 2>&1 || true
          echo "----- bb-agent logs -----"; tail -60 /tmp/bb-agent.log
          if grep -qE 'ModuleNotFoundError|ImportError|SyntaxError|IndentationError' /tmp/bb-agent.log; then
            echo "::error::bb-agent entrypoint hit an import-resolution failure inside the real container. The image layout is flat (/app/agent.py + /app/utils + /app/tools) — imports must be 'from utils…' / 'from tools…', and every package must be COPYed in the Dockerfile."
            exit 1
          fi
          echo "no import-resolution failure in bb-agent entrypoint"

      - name: tear down bb-agent
        if: always()
        run: docker rm -f bb-agent-ci >/dev/null 2>&1 || true

  # Report the aggregate check result back to the backend so the Dev tab can
  # flip the request to "Under development → checks passed/failed". Only fires
  # for pipeline branches (auto/dev-<id>); no-op otherwise. Mirrors the
  # required-context set exactly (mobile, server, agent, agent-tests,
  # container-boot). Bracket notation for hyphenated job ids is the
  # unambiguous form — keep it that way for anything added here.
  report:
    name: report status
    runs-on: ubuntu-latest
    needs: [mobile, server, agent, agent-tests, container-boot]
    if: always() && startsWith(github.head_ref, 'auto/dev-')
    steps:
      - name: Extract request id
        id: rid
        run: echo "id=${GITHUB_HEAD_REF#auto/dev-}" >> "$GITHUB_OUTPUT"
      - name: Callback (passed)
        if: needs.mobile.result == 'success' && needs.server.result == 'success' && needs.agent.result == 'success' && needs.agent-tests.result == 'success' && needs['container-boot'].result == 'success'
        run: |
          curl -sf -X POST "${{ secrets.BB_SERVER_URL }}/dev/github/webhook" \
            -H "content-type: application/json" \
            -H "x-bb-status-token: ${{ secrets.BB_STATUS_WEBHOOK_TOKEN }}" \
            -d "{\"requestId\":\"${{ steps.rid.outputs.id }}\",\"event\":\"checks_passed\"}" || true
      - name: Callback (failed)
        if: needs.mobile.result != 'success' || needs.server.result != 'success' || needs.agent.result != 'success' || needs.agent-tests.result != 'success' || needs['container-boot'].result != 'success'
        run: |
          curl -sf -X POST "${{ secrets.BB_SERVER_URL }}/dev/github/webhook" \
            -H "content-type: application/json" \
            -H "x-bb-status-token: ${{ secrets.BB_STATUS_WEBHOOK_TOKEN }}" \
            -d "{\"requestId\":\"${{ steps.rid.outputs.id }}\",\"event\":\"checks_failed\",\"error\":\"CI failed\"}" || true
